<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GL 2026 Draft Report</title>
<style>
  :root {
    --bg:       #0d0f14;
    --bg2:      #161923;
    --bg3:      #1e2330;
    --bg4:      #252c3d;
    --border:   #2a3148;
    --text:     #e8ecf4;
    --text-sub: #8893a8;
    --text-dim: #5a6480;
    --red:      #e04040;
    --green:    #34d058;
    --blue:     #4f8ef7;
    --gold:     #f0b429;
    --rb:       #16a34a;   --rb-bg: rgba(22,163,74,.18);
    --wr:       #2563eb;   --wr-bg: rgba(37,99,235,.18);
    --te:       #7c3aed;   --te-bg: rgba(124,58,237,.18);
    --qb:       #dc2626;   --qb-bg: rgba(220,38,38,.18);
    --def:      #475569;   --def-bg: rgba(71,85,105,.18);
    --k:        #374151;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif; font-size: 13px; min-height: 100vh; }

  /* ── HEADER ── */
  .header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 18px 0 0; }
  .header-inner { max-width: 1440px; margin: 0 auto; padding: 0 24px; }
  .header-top { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .header-logo { font-size: 22px; }
  .header-title { font-size: 18px; font-weight: 800; letter-spacing: -.4px; }
  .header-sub { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
  .tabs { display: flex; gap: 4px; }
  .tab { padding: 9px 18px; cursor: pointer; border-radius: 8px 8px 0 0; font-size: 13px; font-weight: 600; color: var(--text-sub); background: transparent; border: none; transition: all .15s; letter-spacing: .01em; }
  .tab:hover { color: var(--text); background: var(--bg3); }
  .tab.active { color: var(--text); background: var(--bg); border-top: 2px solid var(--blue); }

  /* ── CONTENT ── */
  .content { max-width: 1440px; margin: 0 auto; padding: 24px; }
  .section-label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 16px; }

  /* ── DRAFT BOARD ── */
  .board-outer { overflow-x: auto; }
  .board-legend { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; font-size: 11px; color: var(--text-sub); }
  .leg-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; vertical-align: middle; }
  .leg-item { display: flex; align-items: center; }
  .leg-sep { color: var(--border); margin: 0 4px; }

  .board-table { border-collapse: separate; border-spacing: 3px; min-width: 1100px; width: 100%; }
  .board-th { background: var(--bg3); color: var(--text-sub); font-weight: 700; font-size: 10px; text-transform: uppercase; letter-spacing: .07em; padding: 8px 10px; border-radius: 6px; text-align: left; white-space: nowrap; }
  .board-th.round-h { text-align: center; min-width: 36px; color: var(--text-dim); }
  .round-cell { background: var(--bg2); color: var(--text-dim); font-size: 10px; font-weight: 800; text-align: center; padding: 0 6px; border-radius: 6px; letter-spacing: .05em; }

  .pick-cell {
    background: var(--bg3);
    border-radius: 7px;
    padding: 8px 9px;
    vertical-align: top;
    min-width: 90px;
    max-width: 110px;
    cursor: default;
    position: relative;
    transition: all .12s;
    border-left: 3px solid transparent;
  }
  .pick-cell:hover { filter: brightness(1.25); transform: translateY(-1px); }
  .pick-cell.rb  { background: var(--rb-bg);  border-left-color: var(--rb); }
  .pick-cell.wr  { background: var(--wr-bg);  border-left-color: var(--wr); }
  .pick-cell.te  { background: var(--te-bg);  border-left-color: var(--te); }
  .pick-cell.qb  { background: var(--qb-bg);  border-left-color: var(--qb); }
  .pick-cell.def,
  .pick-cell.k   { background: var(--def-bg); border-left-color: var(--def); }

  .pick-num-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
  .pick-overall { font-size: 9px; font-weight: 700; color: var(--text-dim); background: rgba(0,0,0,.25); border-radius: 3px; padding: 1px 4px; }
  .pick-delta-badge { font-size: 9px; font-weight: 800; }
  .pick-delta-badge.pos { color: #4ade80; }
  .pick-delta-badge.neg { color: #f87171; }
  .pick-name { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.25; color: var(--text); }
  .pick-meta { font-size: 9px; color: var(--text-sub); margin-top: 3px; display: flex; align-items: center; gap: 4px; }
  .pos-tag { font-size: 8px; font-weight: 800; padding: 1px 4px; border-radius: 3px; letter-spacing: .04em; }
  .pos-tag.rb  { background: var(--rb);  color: #fff; }
  .pos-tag.wr  { background: var(--wr);  color: #fff; }
  .pos-tag.te  { background: var(--te);  color: #fff; }
  .pos-tag.qb  { background: var(--qb);  color: #fff; }
  .pos-tag.def,
  .pos-tag.k   { background: var(--def); color: #fff; }

  /* ── VALUE ANALYSIS ── */
  .teams-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
  .team-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .tc-header { margin-bottom: 10px; }
  .tc-name { font-size: 15px; font-weight: 800; }
  .tc-manager { font-size: 11px; color: var(--text-sub); margin-top: 2px; }
  .tc-pos-bar { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
  .tc-pos-pill { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 99px; }
  .tc-pos-pill.rb  { background: rgba(22,163,74,.22);  color: #4ade80; }
  .tc-pos-pill.wr  { background: rgba(37,99,235,.22);  color: #93c5fd; }
  .tc-pos-pill.te  { background: rgba(124,58,237,.22); color: #c4b5fd; }
  .tc-pos-pill.qb  { background: rgba(220,38,38,.22);  color: #fca5a5; }
  .tc-pos-pill.def { background: rgba(71,85,105,.22);  color: #94a3b8; }
  .tc-picks-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; margin: 8px 0 5px; }
  .tc-pick-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.05); font-size: 11px; }
  .tc-pick-row:last-child { border-bottom: none; }
  .tc-pick-round { color: var(--text-dim); min-width: 22px; font-size: 10px; font-weight: 700; }
  .tc-pick-player { flex: 1; font-weight: 600; }
  .tc-pick-delta { font-weight: 800; font-size: 12px; min-width: 36px; text-align: right; }

  /* ── CONSTRUCTION ── */
  .sl-box { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; margin-bottom: 20px; }
  .sl-box h3 { font-size: 13px; font-weight: 800; margin-bottom: 12px; color: var(--text); }
  .storyline { padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,.05); font-size: 12px; line-height: 1.55; color: var(--text-sub); }
  .storyline:last-child { border-bottom: none; }
  .sl-team { color: var(--gold); font-weight: 700; }
  .con-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
  .con-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .con-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .grade { font-size: 22px; font-weight: 900; padding: 5px 14px; border-radius: 8px; }
  .grade-A   { background: rgba(52,208,88,.15);  color: #4ade80; }
  .grade-Bp  { background: rgba(79,142,247,.15); color: #93c5fd; }
  .grade-B   { background: rgba(96,165,250,.12); color: #7dd3fc; }
  .grade-Cp  { background: rgba(251,191,36,.15); color: #fde047; }
  .grade-C   { background: rgba(248,113,113,.15);color: #f87171; }
  .con-tags { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
  .con-tag { font-size: 11px; padding: 4px 8px; border-radius: 5px; line-height: 1.4; }
  .tag-good { background: rgba(52,208,88,.1);  color: #86efac; }
  .tag-bad  { background: rgba(248,113,113,.1); color: #fca5a5; }
</style>
</head>

const TEAM_ORDER = DATA.team_order;
const TEAMS      = DATA.teams;
const PICKS      = DATA.picks;

function posClass(pos) {
  if (!pos) return 'def';
  const p = pos.toUpperCase();
  if (p === 'RB') return 'rb';
  if (p === 'WR') return 'wr';
  if (p === 'TE') return 'te';
  if (p === 'QB') return 'qb';
  return 'def';
}

function showTab(name) {
  ['board','value','construction'].forEach(t => {
    document.getElementById('tab-' + t).style.display = t === name ? '' : 'none';
  });
  document.querySelectorAll('.tab').forEach((el, i) => {
    el.classList.toggle('active', ['board','value','construction'][i] === name);
  });
}

// ── Draft Board ──────────────────────────────────────────────────────────────
function buildBoard() {
  const table = document.getElementById('boardTable');
  let html = '<thead><tr><th class="board-th round-h">Rd</th>';
  for (const t of TEAM_ORDER) {
    const mgr = TEAMS[t] ? TEAMS[t].manager : '';
    const short = t.length > 13 ? t.slice(0,13) + '…' : t;
    html += `<th class="board-th" title="${t} (${mgr})">${short}</th>`;
  }
  html += '</tr></thead><tbody>';

  const byRound = {};
  for (const p of PICKS) {
    if (!byRound[p.round]) byRound[p.round] = {};
    byRound[p.round][p.ffTeam] = p;
  }

  for (let r = 1; r <= 16; r++) {
    html += `<tr><td class="round-cell">R${r}</td>`;
    const rd = byRound[r] || {};
    for (const team of TEAM_ORDER) {
      const p = rd[team];
      if (!p) { html += '<td class="pick-cell"></td>'; continue; }
      const pc = posClass(p.pos);
      const d  = p.delta;
      let dBadge = '';
      if (d !== null && d !== undefined) {
        if (d > 0)      dBadge = `<span class="pick-delta-badge pos">▲${Math.round(d)}</span>`;
        else if (d < 0) dBadge = `<span class="pick-delta-badge neg">▼${Math.abs(Math.round(d))}</span>`;
      }
      const adpStr = p.adp_fp ? ` · ADP ${p.adp_fp}` : '';
      const tip = `${p.player} | ${p.pos||''} ${p.nflTeam||''}${adpStr}${d !== null && d !== undefined ? ` | Delta: ${d > 0 ? '+' : ''}${Math.round(d)}` : ''}`;
      html += `<td class="pick-cell ${pc}" title="${tip}">
        <div class="pick-num-row">
          <span class="pick-overall">#${p.overall}</span>
          ${dBadge}
        </div>
        <div class="pick-name">${p.player}</div>
        <div class="pick-meta">
          <span class="pos-tag ${pc}">${p.pos||'?'}</span>
          <span>${p.nflTeam||''}</span>
        </div>
      </td>`;
    }
    html += '</tr>';
  }
  html += '</tbody>';
  table.innerHTML = html;
}

// ── Value Analysis ───────────────────────────────────────────────────────────
function buildValue() {
  const grid = document.getElementById('valueGrid');
  let html = '';
  for (const teamName of TEAM_ORDER) {
    const td = TEAMS[teamName];
    const pc = td.pos_counts || {};
    const steals  = (td.top_values  || []).slice(0, 5);
    const reaches = (td.top_reaches || []).slice(0, 5);

    html += `<div class="team-card">
      <div class="tc-header">
        <div class="tc-name">${teamName}</div>
        <div class="tc-manager">${td.manager || ''}</div>
      </div>
      <div class="tc-pos-bar">`;
    for (const [pos, cls] of [['RB','rb'],['WR','wr'],['TE','te'],['QB','qb'],['DEF','def'],['K','def']]) {
      if (pc[pos]) html += `<span class="tc-pos-pill ${cls}">${pos} ×${pc[pos]}</span>`;
    }
    html += '</div>';

    if (steals.length) {
      html += '<div class="tc-picks-label" style="color:#4ade80">▲ Top Steals</div>';
      for (const p of steals) {
        html += `<div class="tc-pick-row">
          <span class="tc-pick-round">R${p.round}</span>
          <span class="pos-tag ${posClass(p.pos)}">${p.pos||''}</span>
          <span class="tc-pick-player">${p.player}</span>
          <span class="tc-pick-delta" style="color:#4ade80">▲${Math.round(p.delta)}</span>
        </div>`;
      }
    }
    if (reaches.length) {
      html += '<div class="tc-picks-label" style="color:#f87171">▼ Top Reaches</div>';
      for (const p of reaches) {
        html += `<div class="tc-pick-row">
          <span class="tc-pick-round">R${p.round}</span>
          <span class="pos-tag ${posClass(p.pos)}">${p.pos||''}</span>
          <span class="tc-pick-player">${p.player}</span>
          <span class="tc-pick-delta" style="color:#f87171">▼${Math.abs(Math.round(p.delta))}</span>
        </div>`;
      }
    }
    html += '</div>';
  }
  grid.innerHTML = html;
}

// ── Roster Construction ──────────────────────────────────────────────────────
function buildConstruction() {
  // Storylines — notable draft narratives
  const storylines = [];
  const aTeams = TEAM_ORDER.filter(t => TEAMS[t].construction.grade === 'A');
  const cTeams = TEAM_ORDER.filter(t => TEAMS[t].construction.grade === 'C' || TEAMS[t].construction.grade === 'C+');

  if (aTeams.length) {
    storylines.push(`<span class="sl-team">${aTeams.join('</span> &amp; <span class="sl-team">')}</span> led the room in roster construction — clean positional foundation, no critical gaps.`);
  }
  if (cTeams.length) {
    storylines.push(`<span class="sl-team">${cTeams.join('</span> &amp; <span class="sl-team">')}</span> face an uphill battle — construction grades flag multiple positional vulnerabilities heading into the season.`);
  }

  // Individual storylines from construction data
  for (const t of TEAM_ORDER) {
    const c = TEAMS[t].construction;
    if (c.issues && c.issues.length > 0) {
      storylines.push(`<span class="sl-team">${t}</span>: ${c.issues[0]}`);
    }
  }

  const slEl = document.getElementById('storylines');
  let slHtml = '<h3>📋 Draft Storylines</h3>';
  for (const s of storylines.slice(0, 7)) {
    slHtml += `<div class="storyline">${s}</div>`;
  }
  slEl.innerHTML = slHtml;

  // Cards
  const grid = document.getElementById('constructionGrid');
  let html = '';
  for (const teamName of TEAM_ORDER) {
    const td = TEAMS[teamName];
    const c  = td.construction;
    const pc = td.pos_counts || {};
    const gradeCls = c.grade === 'A' ? 'grade-A' :
                     c.grade === 'B+' ? 'grade-Bp' :
                     c.grade === 'B'  ? 'grade-B' :
                     c.grade === 'C+' ? 'grade-Cp' : 'grade-C';

    html += `<div class="con-card">
      <div class="con-top">
        <div>
          <div class="tc-name">${teamName}</div>
          <div class="tc-manager" style="margin-top:2px">${td.manager||''}</div>
          <div class="tc-pos-bar" style="margin-top:8px">`;
    for (const [pos, cls] of [['RB','rb'],['WR','wr'],['TE','te'],['QB','qb'],['DEF','def'],['K','def']]) {
      if (pc[pos]) html += `<span class="tc-pos-pill ${cls}">${pos} ×${pc[pos]}</span>`;
    }
    html += `</div></div><div class="grade ${gradeCls}">${c.grade}</div></div>
      <div class="con-tags">`;
    for (const s of (c.strengths || [])) {
      html += `<div class="con-tag tag-good">✓ ${s}</div>`;
    }
    for (const s of (c.issues || [])) {
      html += `<div class="con-tag tag-bad">⚠ ${s}</div>`;
    }
    html += '</div></div>';
  }
  grid.innerHTML = html;
}

buildBoard();
buildValue();
buildConstruction();
</script>
