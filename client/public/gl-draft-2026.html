<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GL 2026 Draft Report</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0e;
    --bg2: #161616;
    --bg3: #1e1e1e;
    --border: #2a2a2a;
    --text: #f0f0f0;
    --muted: #777;
    --green: #ACF910;
    --rb: #4ade80;
    --wr: #60a5fa;
    --qb: #f87171;
    --te: #fb923c;
    --k: #a78bfa;
    --def: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; font-size: 13px; }

  /* HEADER */
  .page-header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 20px 28px 16px;
    display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap;
  }
  .page-header h1 { font-family: 'Bebas Neue', sans-serif; font-size: 36px; color: var(--text); letter-spacing: 0.04em; line-height: 1; }
  .page-header .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .league-badge { background: var(--green); color: #000; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; align-self: center; }

  /* TABS */
  .tab-bar { display: flex; border-bottom: 1px solid var(--border); background: var(--bg2); padding: 0 28px; gap: 0; overflow-x: auto; scrollbar-width: none; }
  .tab-bar button { background: none; border: none; border-bottom: 2px solid transparent; color: var(--muted); padding: 12px 14px; font-size: 12px; font-family: inherit; cursor: pointer; white-space: nowrap; transition: color 0.15s; margin-bottom: -1px; }
  .tab-bar button.active { color: var(--text); border-bottom-color: var(--green); }

  /* CONTENT */
  .content { padding: 24px 28px; max-width: 1400px; margin: 0 auto; }
  .section { display: none; }
  .section.active { display: block; }

  /* LEGEND */
  .legend { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
  .dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

  /* DRAFT BOARD */
  .board-wrap { overflow-x: auto; }
  .board { border-collapse: collapse; white-space: nowrap; font-size: 11px; }
  .board th { background: var(--bg3); color: var(--muted); font-weight: 600; padding: 8px 10px; border: 1px solid var(--border); text-align: center; font-size: 10px; letter-spacing: 0.05em; position: sticky; top: 0; z-index: 2; min-width: 110px; }
  .board th:first-child { min-width: 64px; position: sticky; left: 0; z-index: 3; background: var(--bg3); }
  .board td { border: 1px solid var(--border); padding: 6px 8px; vertical-align: top; min-width: 110px; }
  .board td:first-child { background: var(--bg3); color: var(--muted); font-weight: 700; text-align: center; font-size: 11px; position: sticky; left: 0; }
  .pick-cell { }
  .pick-num { font-size: 9px; color: var(--muted); margin-bottom: 2px; }
  .pick-player { font-weight: 600; color: var(--text); font-size: 11px; line-height: 1.3; }
  .pick-pos { display: inline-block; font-size: 9px; font-weight: 700; padding: 1px 4px; border-radius: 3px; color: #000; margin-top: 2px; }
  .pos-RB { background: var(--rb); }
  .pos-WR { background: var(--wr); }
  .pos-QB { background: var(--qb); }
  .pos-TE { background: var(--te); }
  .pos-K { background: var(--k); }
  .pos-DEF { background: var(--def); }

  /* TEAM CARDS */
  .teams-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .team-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .team-card-header { padding: 14px 16px 10px; border-bottom: 1px solid var(--border); }
  .team-name { font-weight: 700; font-size: 14px; color: var(--text); }
  .manager-name { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .draft-slot { font-size: 10px; color: var(--green); font-weight: 600; margin-top: 4px; }
  .pos-bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; margin: 10px 16px 0; }
  .pos-bar-seg { transition: width 0.3s; }
  .pos-bar-labels { display: flex; gap: 8px; padding: 6px 16px 12px; flex-wrap: wrap; }
  .pos-label { font-size: 10px; color: var(--muted); }
  .pos-label span { font-weight: 700; color: var(--text); }
  .pick-list { padding: 0 16px 14px; }
  .pick-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px solid #1a1a1a; }
  .pick-row:last-child { border-bottom: none; }
  .pick-rd { font-size: 10px; color: var(--muted); width: 24px; flex-shrink: 0; }
  .pick-name { flex: 1; font-size: 12px; color: var(--text); }
  .pick-badge { font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 3px; color: #000; }

  /* ANALYSIS */
  .analysis-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; margin-bottom: 28px; }
  .analysis-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
  .analysis-card h3 { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--green); margin-bottom: 14px; }
  .timeline { display: flex; flex-direction: column; gap: 8px; }
  .tl-row { display: flex; align-items: center; gap: 10px; }
  .tl-pos { width: 36px; font-size: 10px; font-weight: 700; text-align: right; flex-shrink: 0; }
  .tl-track { flex: 1; position: relative; height: 18px; background: var(--bg3); border-radius: 3px; overflow: hidden; }
  .tl-bar { position: absolute; top: 0; height: 100%; border-radius: 3px; opacity: 0.85; }
  .tl-label { font-size: 9px; color: var(--muted); white-space: nowrap; }

  .storyline-list { display: flex; flex-direction: column; gap: 10px; }
  .storyline-item { padding: 10px 12px; background: var(--bg3); border-radius: 7px; border-left: 3px solid var(--green); }
  .storyline-item.reach { border-left-color: var(--qb); }
  .storyline-item.value { border-left-color: var(--rb); }
  .storyline-item.neutral { border-left-color: var(--wr); }
  .storyline-title { font-weight: 600; font-size: 12px; color: var(--text); margin-bottom: 3px; }
  .storyline-desc { font-size: 11px; color: var(--muted); line-height: 1.5; }

  .stat-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--border); align-items: center; }
  .stat-row:last-child { border-bottom: none; }
  .stat-label { font-size: 11px; color: var(--muted); }
  .stat-val { font-size: 12px; font-weight: 600; color: var(--text); }
  .stat-val.green { color: var(--rb); }
  .stat-val.red { color: var(--qb); }

  .pos-count-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .pos-count-item { background: var(--bg3); border-radius: 6px; padding: 8px 4px; text-align: center; }
  .pos-count-num { font-size: 20px; font-weight: 700; }
  .pos-count-lbl { font-size: 9px; color: var(--muted); margin-top: 2px; }

  @media (max-width: 600px) {
    .content { padding: 16px; }
    .page-header { padding: 16px; }
    .tab-bar { padding: 0 16px; }
    .teams-grid { grid-template-columns: 1fr; }
    .analysis-grid { grid-template-columns: 1fr; }
  }
</style>
</head>

</div>

// Group picks by team

// ---- DRAFT BOARD ----
function buildBoard() {
  const table = document.getElementById('draftTable');
  // header
  let html = '<thead><tr><th>RD</th>';
  DRAFT_ORDER.forEach(t => {
    html += `<th>${t}<br><span style="color:var(--green);font-size:9px">${MANAGERS[t]}</span></th>`;
  });
  html += '</tr></thead><tbody>';

  for (let r = 1; r <= 16; r++) {
    html += `<tr><td>R${r}</td>`;
    DRAFT_ORDER.forEach((team, ti) => {
      // snake: odd rounds forward, even rounds reverse
      const slotInRound = (r % 2 === 1) ? ti + 1 : 12 - ti;
      const overall = (r - 1) * 12 + slotInRound;
      const pick = PICKS.find(p => p.overall === overall);
      if (pick) {
        const c = posColor(pick.pos);
        html += `<td class="pick-cell">
          <div class="pick-num">${r}.${pick.pick} (${overall})</div>
          <div class="pick-player">${pick.player}</div>
          <span class="pick-pos pos-${pick.pos}">${pick.pos}</span>
        </td>`;
      } else {
        html += '<td>—</td>';
      }
    });
    html += '</tr>';
  }
  html += '</tbody>';
  table.innerHTML = html;
}

// ---- TEAMS ----
function buildTeams() {
  const grid = document.getElementById('teamsGrid');
  let html = '';
  DRAFT_ORDER.forEach((team, idx) => {
    const picks = teamPicks[team];
    const posCounts = {};
    picks.forEach(p => { posCounts[p.pos] = (posCounts[p.pos] || 0) + 1; });
    const total = picks.length;

    // bar segments
    const barSegs = Object.entries(posCounts).map(([pos, cnt]) => {
      const pct = (cnt / total * 100).toFixed(1);
      return `<div class="pos-bar-seg" style="width:${pct}%;background:${posColor(pos)}"></div>`;
    }).join('');

    const posLabels = Object.entries(posCounts).map(([pos, cnt]) =>
      `<div class="pos-label">${pos}: <span>${cnt}</span></div>`
    ).join('');

    const skillPicks = picks.filter(p => ['RB','WR','QB','TE'].includes(p.pos));

    html += `<div class="team-card">
      <div class="team-card-header">
        <div class="team-name">${team}</div>
        <div class="manager-name">${MANAGERS[team]}</div>
        <div class="draft-slot">Pick #${idx + 1}</div>
      </div>
      <div class="pos-bar">${barSegs}</div>
      <div class="pos-bar-labels">${posLabels}</div>
      <div class="pick-list">`;

    skillPicks.forEach(p => {
      html += `<div class="pick-row">
        <div class="pick-rd">R${p.round}</div>
        <div class="pick-name">${p.player}</div>
        <span class="pick-badge pos-${p.pos}">${p.pos}</span>
      </div>`;
    });

    html += `</div></div>`;
  });
  grid.innerHTML = html;
}

  // QB picks in rounds 1-6

  // Teams without early QB (picked after round 6)
  const qbPickRound = {};

    if (!qbPickRound[p.ffTeam] || p.round < qbPickRound[p.ffTeam]) qbPickRound[p.ffTeam] = p.round;
  });

  // Position run in rounds 3-4 (QB panic)
  const r3r4 = PICKS.filter(p => (p.round === 3 || p.round === 4) && p.pos === 'QB');

  const earlyTEs = tePicks.filter(p => p.round <= 5);

      RB: p.filter(x => x.pos === 'RB').length,

      </div>
      <div class="storyline-item value">
        <div class="storyline-title">Ed: Daniels + Herbert, Double QB</div>
        <div class="storyline-desc">Ed drafted Jayden Daniels in round 3 then Justin Herbert in round 4 — two QB1s. Massive trade chip or a hedge that limits his flexibility.</div>
      </div>
      <div class="storyline-item reach">
        <div class="storyline-title">WR depth thin in rounds 5–7</div>
        <div class="storyline-desc">With 8 QBs gone by end of round 4, mid-round WR options like Juju, Jameson Williams, and Rashee Rice were the best available — slim pickings at the position.</div>
      </div>
      <div class="storyline-item neutral">
        <div class="storyline-title">Ramon: Gibbs + Hall, RB1-RB2 stack</div>
        <div class="storyline-desc">Ramon took Gibbs #1 overall then Breece Hall at 2.12. Two workhorse RBs to anchor his lineup heading into the season.</div>
      </div>
    </div>
  </div>`;

  // Card 5: Roster construction table
  html += `<div class="analysis-card" style="grid-column: span 2">
    <h3>Roster Construction — Skill Positions</h3>
    <div style="overflow-x:auto">
    <table style="width:100%;border-collapse:collapse;font-size:11px">
      <thead>
        <tr style="color:var(--muted)">
          <th style="text-align:left;padding:6px 8px;border-bottom:1px solid var(--border)">Team</th>
          <th style="text-align:left;padding:6px 8px;border-bottom:1px solid var(--border)">Mgr</th>
          <th style="text-align:center;padding:6px 8px;border-bottom:1px solid var(--border);color:var(--rb)">RB</th>
          <th style="text-align:center;padding:6px 8px;border-bottom:1px solid var(--border);color:var(--wr)">WR</th>
          <th style="text-align:center;padding:6px 8px;border-bottom:1px solid var(--border);color:var(--qb)">QB</th>
          <th style="text-align:center;padding:6px 8px;border-bottom:1px solid var(--border);color:var(--te)">TE</th>
          <th style="text-align:left;padding:6px 8px;border-bottom:1px solid var(--border)">Strategy</th>
        </tr>
      </thead>
      <tbody>
        ${DRAFT_ORDER.map(team => {
          const c = teamConstruction[team];
          const strategy = c.QB >= 2 ? '2-QB stack' : c.RB >= 6 ? 'RB heavy' : c.WR >= 7 ? 'WR heavy' : c.TE >= 3 ? 'TE premium' : 'Balanced';
          return `<tr style="border-bottom:1px solid var(--border)">
            <td style="padding:6px 8px;font-weight:500">${team}</td>
            <td style="padding:6px 8px;color:var(--muted)">${MANAGERS[team]}</td>
            <td style="padding:6px 8px;text-align:center;color:var(--rb);font-weight:700">${c.RB}</td>
            <td style="padding:6px 8px;text-align:center;color:var(--wr);font-weight:700">${c.WR}</td>
            <td style="padding:6px 8px;text-align:center;color:var(--qb);font-weight:700">${c.QB}</td>
            <td style="padding:6px 8px;text-align:center;color:var(--te);font-weight:700">${c.TE}</td>
            <td style="padding:6px 8px;color:var(--muted);font-size:10px">${strategy}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
    </div>
  </div>`;

  grid.innerHTML = html;
}

function showTab(id, btn) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-bar button').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
}

buildBoard();
buildTeams();
buildAnalysis();
</script>
</body>
</html>
