<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://sleepercdn.com https://yahoofantasysports-res.cloudinary.com https://a.espncdn.com; object-src 'none'; base-uri 'none'"><title>Connected leagues · CFN</title><script src="theme.js"></script><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="connected.css"><script defer src="connected.js"></script></head>
<body><header><div class="nav-wrap"><a href="index.html" class="brand">CFN</a><nav><a href="index.html">Network</a><span>Connected leagues</span></nav><button id="logout" hidden>Sign out</button></div></header>
<main id="connected-main"><p class="eyebrow">YOUR LEAGUES, TOGETHER</p><h1>Connected leagues.</h1><p class="intro">Your imported matchups, rosters and standings. Read-only, with scores from the original league.</p>
<form id="signin"><label for="email">Invitation email</label><input id="email" type="email" autocomplete="email" required><button id="request" type="submit">Email me a sign-in code</button><div id="code-step" hidden><label for="code">Email code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}"><button id="verify" type="button">Sign in</button></div></form>
<p id="notice" role="status" aria-live="polite"></p><section id="workspace" hidden><div class="connected-controls"><label>League <select id="league"></select></label><label>Week <select id="week"></select></label><button id="refresh">Refresh</button></div><div class="connected-controls" role="group" aria-label="League view"><button id="matchups">Matchups</button><button id="standings">Standings</button><button id="trades">Trades</button><button id="waivers">Waivers</button></div><p id="freshness"></p><div id="content"></div></section>
</main><dialog id="roster"><button id="close-roster" aria-label="Close roster">Close</button><div id="roster-content"></div></dialog></body></html>
