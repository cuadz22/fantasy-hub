<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Review recaps · CFN Studio</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="recap.css"><script defer src="recap.js"></script><script defer src="recap-review.js"></script></head><body><main style="max-width:980px;padding:24px 20px;margin:auto"><a class="text-link" href="index.html#studio">← Studio</a><h1>Review the weekly edition.</h1><p>Drafts stay private. Publish only when the results and copy are ready.</p><p id="review-message" role="status"></p><section id="review-login" class="recap-review"><form id="request-code"><label>Your invitation email<input id="review-email" type="email" autocomplete="email" required></label><button class="pill">Email a sign-in code</button></form><form id="verify-code" hidden><label>Email code<input id="review-code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" required></label><button class="pill">Sign in</button></form></section><section id="review-work" hidden><button id="review-logout" class="pill">Sign out</button><form id="prepare-edition" class="recap-review"><label>League<select id="review-league"><option value="gl">Gentlemen’s League</option><option value="bh">Beaners &amp; Husseins</option><option value="rb">Rebirth</option><option value="sts">Shoot the Shits</option></select></label><label>Completed week<input id="review-week" type="number" min="1" max="14" required></label><button class="pill">Prepare or refresh draft</button></form><div id="review-editions"></div><div id="review-editor" class="recap-review"></div><article id="review-preview"></article></section></main><dialog class="recap-dialog" id="recap-match-dialog"><form method="dialog"><button class="pill">Back to recap</button></form><div class="recap-match-body"></div></dialog></body></html>
